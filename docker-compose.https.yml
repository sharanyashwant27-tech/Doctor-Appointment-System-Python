# HTTPS profile — use with:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
#
# Generate local certs first:
#   powershell -File scripts/generate-dev-certs.ps1

services:
  frontend:
    ports:
      - "8905:443"
      - "8080:80"
    volumes:
      - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    environment:
      - HTTPS=1

  backend:
    environment:
      CORS_ORIGINS: https://localhost:8905,https://127.0.0.1:8905
      CSRF_TRUSTED_HOSTS: localhost:8905,127.0.0.1:8905
      HTTPS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      CSRF_ENABLED: "true"
