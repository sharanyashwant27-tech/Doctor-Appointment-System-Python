services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: medibook
      POSTGRES_DB: medibook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medibook-backend:latest
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://medibook:medibook@db:5432/medibook
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      CORS_ORIGINS: http://localhost:8905
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medibook-backend:latest
    command: celery -A notifications.celery_app.celery_app worker --loglevel=info
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://medibook:medibook@db:5432/medibook
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medibook-backend:latest
    command: celery -A notifications.celery_app.celery_app beat --loglevel=info
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://medibook:medibook@db:5432/medibook
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      - worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: medibook-frontend:latest
    ports:
      - "8905:80"
    depends_on:
      - backend

volumes:
  postgres_data:
